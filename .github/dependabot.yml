version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 4
    commit-message:
      prefix: chore(deps)
    groups:
      routine-node-updates:
        patterns: ["*"]
        exclude-patterns: ["@whiskeysockets/baileys", "sharp"]
        update-types: [minor, patch]
    # Protocol changes, native dependencies and majors remain individual PRs.
    # Do not ignore Baileys: security/version candidates must remain visible.

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore(ci)
    groups:
      routine-actions-updates:
        patterns: ["*"]
        update-types: [minor, patch]
