name: Release

on:
  push:
    branches: [main]
    paths:
      - ".release/*.json"
  workflow_dispatch:
    inputs:
      mode:
        description: "Preflight validates without publishing; publish is allowed only from main"
        type: choice
        options:
          - preflight
          - publish
        default: preflight
        required: true
      marker:
        description: "Optional .release/<version>.json path; blank auto-detects the only marker"
        type: string
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: whatsapp-adapter-release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    outputs:
      candidate_sha: ${{ steps.candidate.outputs.sha }}
      publish: ${{ steps.candidate.outputs.publish }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Resolve release mode and marker
        env:
          REQUESTED_MODE: ${{ github.event.inputs.mode || 'publish' }}
          REQUESTED_MARKER: ${{ github.event.inputs.marker || '' }}
        shell: bash
        run: |
          set -euo pipefail

          publish=false
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            publish=true
          elif [[ "$REQUESTED_MODE" == "publish" ]]; then
            if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
              echo "manual publish is only allowed from the main branch" >&2
              exit 1
            fi
            publish=true
          fi
          echo "PUBLISH_RELEASE=$publish" >> "$GITHUB_ENV"

          marker="$REQUESTED_MARKER"
          if [[ -z "$marker" ]]; then
            mapfile -t markers < <(find .release -maxdepth 1 -type f -name '*.json' -print | sort)
            if [[ "${#markers[@]}" -ne 1 ]]; then
              echo "expected exactly one release marker, found ${#markers[@]}" >&2
              exit 1
            fi
            marker="${markers[0]}"
          fi
          if [[ "$marker" != .release/*.json || ! -f "$marker" ]]; then
            echo "release marker must be an existing .release/*.json file" >&2
            exit 1
          fi

          python scripts/release_contract.py validate-marker "$marker" \
            --github-env "$GITHUB_ENV" \
            --output-dir "$RUNNER_TEMP"

      - name: Inspect remote main state
        if: env.PUBLISH_RELEASE == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags --force
          remote_version=$(git show origin/main:metadata.yaml | sed -n 's/^version: //p')
          if [[ -z "$remote_version" ]]; then
            echo "cannot resolve metadata version from origin/main" >&2
            exit 1
          fi

          if [[ "$remote_version" == "$RELEASE_VERSION" ]]; then
            subject=$(git log -1 --format=%s origin/main)
            if [[ "$subject" != "Release v${RELEASE_VERSION}:"* ]]; then
              echo "origin/main already has target version but is not the expected release commit" >&2
              exit 1
            fi
            if git ls-tree -r --name-only origin/main .release | grep -Eq '^\.release/.*\.json$'; then
              echo "target release commit unexpectedly still contains a release marker" >&2
              exit 1
            fi
            git checkout --detach origin/main
            python scripts/release_contract.py validate-repo --expected-version "$RELEASE_VERSION"
            echo "RESUME_RELEASE=true" >> "$GITHUB_ENV"
            echo "Resuming release publication from existing release commit $subject"
          elif [[ "$remote_version" == "$PREVIOUS_VERSION" ]]; then
            if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]]; then
              echo "origin/main moved after this release run started; refusing a stale publish" >&2
              exit 1
            fi
            echo "RESUME_RELEASE=false" >> "$GITHUB_ENV"
          else
            echo "stale release marker: origin/main is $remote_version, expected $PREVIOUS_VERSION or $RELEASE_VERSION" >&2
            exit 1
          fi

      - name: Apply release specification
        if: env.RESUME_RELEASE != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/release_contract.py apply-marker "$RELEASE_MARKER"
          python scripts/release_contract.py validate-repo --expected-version "$RELEASE_VERSION"

      - name: Commit release candidate
        if: env.RESUME_RELEASE != 'true'
        shell: bash
        run: |
          set -euo pipefail
          subject=$(cat "$RELEASE_SUBJECT_FILE")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python scripts/write-build-info.py --version "$RELEASE_VERSION" --source-commit "$GITHUB_SHA"
          git add .build-info.json CHANGELOG.md main.py metadata.yaml package.json package-lock.json
          git add -A -- "$RELEASE_MARKER"
          git commit -m "Release v${RELEASE_VERSION}: ${subject}"
          if ! git diff --quiet || ! git diff --cached --quiet; then
            echo "release candidate left unexpected uncommitted changes" >&2
            git status --short
            exit 1
          fi

      - name: Preserve immutable release candidate
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          candidate_dir="$RUNNER_TEMP/release-candidate"
          mkdir -p "$candidate_dir"
          git bundle create "$candidate_dir/candidate.bundle" HEAD
          cp "$RELEASE_NOTES_FILE" "$candidate_dir/notes.md"
          python - <<'PYCODE'
          import json, os, pathlib, subprocess
          state = {
              'candidateSha': subprocess.check_output(['git', 'rev-parse', 'HEAD']).decode().strip(),
              'version': os.environ['RELEASE_VERSION'],
              'publish': os.environ['PUBLISH_RELEASE'],
              'resume': os.environ.get('RESUME_RELEASE', 'false'),
          }
          directory = pathlib.Path(os.environ['RUNNER_TEMP']) / 'release-candidate'
          (directory / 'state.json').write_text(json.dumps(state), encoding='utf-8')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f"sha={state['candidateSha']}\npublish={state['publish']}\n")
          PYCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/release-candidate/
          retention-days: 7
          if-no-files-found: error

  validate:
    needs: prepare
    uses: ./.github/workflows/validate-runtime.yml
    with:
      candidate_artifact: release-candidate-${{ github.run_id }}
      candidate_sha: ${{ needs.prepare.outputs.candidate_sha }}

  publish:
    needs: [prepare, validate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: release-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/release-candidate
      - name: Restore validated release candidate
        env:
          CANDIDATE_SHA: ${{ needs.prepare.outputs.candidate_sha }}
        shell: python
        run: |
          import json, os, pathlib, subprocess
          directory = pathlib.Path(os.environ['RUNNER_TEMP']) / 'release-candidate'
          state = json.loads((directory / 'state.json').read_text(encoding='utf-8'))
          subprocess.check_call(['git', 'fetch', str(directory / 'candidate.bundle'), 'HEAD'])
          actual = subprocess.check_output(['git', 'rev-parse', 'FETCH_HEAD']).decode().strip()
          if actual != os.environ['CANDIDATE_SHA'] or actual != state['candidateSha']:
              raise RuntimeError('candidate changed after matrix validation')
          subprocess.check_call(['git', 'checkout', '--detach', actual])
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              for key, value in {'RELEASE_VERSION': state['version'], 'PUBLISH_RELEASE': state['publish'],
                                 'RESUME_RELEASE': state['resume'], 'RELEASE_NOTES_FILE': str(directory / 'notes.md')}.items():
                  output.write(f'{key}={value}\n')

      - name: Build AstrBot plugin ZIP
        shell: bash
        run: |
          set -euo pipefail
          asset="astrbot_plugin_whatsapp_adapter-v${RELEASE_VERSION}.zip"
          asset_path="$RUNNER_TEMP/$asset"
          checksum_path="$asset_path.sha256"
          git archive \
            --format=zip \
            --prefix="astrbot_plugin_whatsapp_adapter/" \
            --output="$asset_path" \
            HEAD
          (
            cd "$RUNNER_TEMP"
            sha256sum "$asset" > "$asset.sha256"
          )
          echo "RELEASE_ASSET=$asset_path" >> "$GITHUB_ENV"
          echo "RELEASE_ASSET_NAME=$asset" >> "$GITHUB_ENV"
          echo "RELEASE_CHECKSUM=$checksum_path" >> "$GITHUB_ENV"
          echo "RELEASE_CHECKSUM_NAME=$asset.sha256" >> "$GITHUB_ENV"

      - name: Validate AstrBot release artifact
        shell: bash
        run: |
          set -euo pipefail
          python scripts/release_contract.py validate-archive "$RELEASE_ASSET" \
            --expected-version "$RELEASE_VERSION"
          python scripts/verify-release-runtime.py "$RELEASE_ASSET" --require-build-info
          (
            cd "$RUNNER_TEMP"
            sha256sum -c "$RELEASE_CHECKSUM_NAME"
          )

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets-${{ github.run_id }}
          path: |
            ${{ env.RELEASE_ASSET }}
            ${{ env.RELEASE_CHECKSUM }}
          retention-days: 7
          if-no-files-found: error

      - name: Preflight summary
        if: env.PUBLISH_RELEASE != 'true'
        run: |
          echo "Release v${RELEASE_VERSION} passed full preflight."
          echo "No commit, tag, or GitHub Release was pushed."

      - name: Push release commit
        if: env.PUBLISH_RELEASE == 'true' && env.RESUME_RELEASE != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:main

      - name: Publish or resume GitHub Release
        if: env.PUBLISH_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v${RELEASE_VERSION}"
          target=$(git rev-parse HEAD)

          git fetch origin main --tags --force
          if [[ "$(git rev-parse origin/main)" != "$target" ]]; then
            echo "origin/main no longer points at the validated release commit" >&2
            exit 1
          fi

          tag_exists=false
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            tag_exists=true
            tag_target=$(git rev-list -n 1 "$tag")
            if [[ "$tag_target" != "$target" ]]; then
              echo "existing tag $tag points to $tag_target, expected $target" >&2
              exit 1
            fi
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            if [[ "$tag_exists" != true ]]; then
              echo "GitHub Release $tag exists but its tag was not found after fetching tags" >&2
              exit 1
            fi
            gh release edit "$tag" \
              --title "$tag" \
              --notes-file "$RELEASE_NOTES_FILE"
            gh release upload "$tag" \
              "$RELEASE_ASSET" \
              "$RELEASE_CHECKSUM" \
              --clobber
          elif [[ "$tag_exists" == true ]]; then
            gh release create "$tag" \
              --verify-tag \
              --title "$tag" \
              --notes-file "$RELEASE_NOTES_FILE" \
              "$RELEASE_ASSET" \
              "$RELEASE_CHECKSUM"
          else
            gh release create "$tag" \
              --target "$target" \
              --title "$tag" \
              --notes-file "$RELEASE_NOTES_FILE" \
              "$RELEASE_ASSET" \
              "$RELEASE_CHECKSUM"
          fi

          git fetch origin "refs/tags/$tag:refs/tags/$tag" --force
          if [[ "$(git rev-list -n 1 "$tag")" != "$target" ]]; then
            echo "published tag does not resolve to the validated release commit" >&2
            exit 1
          fi
          state=$(gh release view "$tag" --json isDraft,isPrerelease --jq '[.isDraft,.isPrerelease] | @tsv')
          if [[ "$state" != $'false\tfalse' ]]; then
            echo "published release is unexpectedly draft or prerelease: $state" >&2
            exit 1
          fi
          assets=$(gh release view "$tag" --json assets --jq '.assets[].name')
          grep -Fxq "$RELEASE_ASSET_NAME" <<<"$assets"
          grep -Fxq "$RELEASE_CHECKSUM_NAME" <<<"$assets"
