name: Restore WhatsApp instance messaging settings

on:
  push:
    branches:
      - agent/restore-instance-messaging-settings
    paths:
      - .github/workflows/restore-instance-messaging-settings.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/restore-instance-messaging-settings
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply configuration patch
        run: python .github/scripts/restore_instance_messaging_settings.py
      - name: Compile
        run: python -m compileall -q whatsapp_adapter.py whatsapp_config_policy.py tests
      - name: Run regression tests
        run: python -m unittest discover -v tests
      - name: Commit clean result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: restore WhatsApp instance messaging settings"
          git push origin HEAD:agent/restore-instance-messaging-settings
