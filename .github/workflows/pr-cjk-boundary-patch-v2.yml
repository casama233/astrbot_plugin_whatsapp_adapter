name: PR CJK markdown boundary patch v2

on:
  push:
    branches:
      - fix/whatsapp-cjk-markdown-boundaries

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/whatsapp-cjk-markdown-boundaries
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Apply patch
        run: |
          python scripts/pr_cjk_boundary_patch.py
          python scripts/pr_cjk_boundary_adjust_tests.py
      - name: Validate focused tests
        run: |
          python -m compileall -q _whatsapp_helpers_impl.py tests/test_whatsapp_markdown_cjk_boundaries.py
          python -m unittest -v tests.test_whatsapp_markdown_cjk_boundaries
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _whatsapp_helpers_impl.py tests/test_whatsapp_markdown_cjk_boundaries.py
          git diff --cached --quiet && exit 0
          git commit -m "fix: degrade unsafe WhatsApp inline markdown boundaries"
          git push origin HEAD:fix/whatsapp-cjk-markdown-boundaries
