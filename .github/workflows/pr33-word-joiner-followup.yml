name: PR 33 word joiner follow-up

on:
  push:
    branches:
      - fix/whatsapp-cjk-markdown-boundaries

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/whatsapp-cjk-markdown-boundaries
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Apply review fix and regression
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('_whatsapp_helpers_impl.py')
          text = source.read_text(encoding='utf-8')
          old = '    return not char or char.isspace() or _markdown_punctuation(char)\n'
          new = '    return (\n        not char\n        or char == _WORD_JOINER\n        or char.isspace()\n        or _markdown_punctuation(char)\n    )\n'
          if old not in text:
              raise SystemExit('boundary return anchor not found')
          source.write_text(text.replace(old, new, 1), encoding='utf-8')

          tests = Path('tests/test_whatsapp_markdown_cjk_boundaries.py')
          text = tests.read_text(encoding='utf-8')
          anchor = '''    def test_native_whatsapp_source_is_not_rewritten(self) -> None:\n'''
          regression = '''    def test_escaped_marker_before_safe_style_keeps_style(self) -> None:\n        word_joiner = "\\u2060"\n        cases = {\n            r"\\***bold**": f"*{word_joiner}*bold*",\n            r"\\_**bold**": f"_{word_joiner}*bold*",\n            r"\\~**bold**": f"~{word_joiner}*bold*",\n        }\n        for source, expected in cases.items():\n            with self.subTest(source=source):\n                self.assertEqual(helpers.format_whatsapp_markdown(source), expected)\n                self.assertEqual(\n                    helpers.format_whatsapp_markdown(source, streaming=True),\n                    expected,\n                )\n\n'''
          if anchor not in text:
              raise SystemExit('test insertion anchor not found')
          tests.write_text(text.replace(anchor, regression + anchor, 1), encoding='utf-8')
          PY
          python -m compileall -q _whatsapp_helpers_impl.py tests/test_whatsapp_markdown_cjk_boundaries.py
          python -m unittest -v tests.test_whatsapp_markdown_cjk_boundaries
      - name: Commit follow-up
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _whatsapp_helpers_impl.py tests/test_whatsapp_markdown_cjk_boundaries.py
          git diff --cached --quiet && exit 0
          git commit -m "fix: preserve styles after escaped markdown markers"
          git push origin HEAD:fix/whatsapp-cjk-markdown-boundaries
