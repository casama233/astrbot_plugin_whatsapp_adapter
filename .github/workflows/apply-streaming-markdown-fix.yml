name: Apply streaming Markdown fix

on:
  push:
    branches:
      - agent/fix-streaming-markdown-conversion

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply patch
        run: python .github/scripts/apply_streaming_markdown_fix.py

      - name: Compile
        run: python -m py_compile whatsapp_helpers.py whatsapp_event.py

      - name: Run tests
        run: python -m unittest -v tests/test_whatsapp_markdown.py

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: handle Markdown across WhatsApp streaming chunks"
          git push
