name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: Validate AstrBot release contract
        run: python scripts/release_contract.py validate-repo
      - name: Compile Python
        run: python -m compileall -q .
      - name: Python tests
        run: python -m unittest discover -v tests
      - name: Install Node dependencies
        run: npm ci
      - name: Node tests
        run: >-
          python -c "import glob, subprocess;
          files=glob.glob('gateway/*.test.mjs')+glob.glob('scripts/*.test.mjs');
          subprocess.check_call(['node','--test',*files])"
