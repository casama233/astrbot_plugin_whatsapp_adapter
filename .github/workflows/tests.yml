name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate AstrBot release contract
        run: python scripts/release_contract.py validate-repo
      - name: Compile Python
        run: python -m compileall -q .
      - name: Python tests
        run: python -m unittest discover -v tests
      - name: Install Markdown parser research dependency
        run: python -m pip install --disable-pip-version-check "markdown-it-py==4.2.0"
      - name: Markdown parser differential prototype
        run: python -m unittest discover -v tests -p 'test_markdown_it_differential.py'
      - name: Install Node dependencies
        run: npm ci
      - name: Node tests
        run: node --test gateway/*.test.mjs scripts/*.test.mjs
