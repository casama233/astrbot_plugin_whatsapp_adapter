name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Keep the historical plugin baseline covered while AstrBot deployments
          # move to the current Python 3.12 / Node 22 toolchain.
          - os: ubuntu-latest
            python: "3.11"
            node: "20"
          - os: windows-latest
            python: "3.11"
            node: "20"
          - os: ubuntu-latest
            python: "3.12"
            node: "22"
          - os: windows-latest
            python: "3.12"
            node: "22"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node }}
      - name: Validate AstrBot release contract
        run: python scripts/release_contract.py validate-repo
      - name: Compile Python
        run: python -m compileall -q .
      - name: Python tests
        run: python -m unittest discover -v tests
      - name: Install Node dependencies
        run: npm ci
      - name: Node tests
        run: >-
          python -c "import glob, subprocess;
          files=glob.glob('gateway/*.test.mjs')+glob.glob('scripts/*.test.mjs');
          subprocess.check_call(['node','--test',*files])"
