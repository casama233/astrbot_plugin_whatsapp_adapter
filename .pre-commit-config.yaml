minimum_pre_commit_version: '3.5.0'
repos:
  - repo: local
    hooks:
      - id: fix-gateway-config-scope
        name: Fix Gateway config scope
        entry: python .github/scripts/fix_gateway_config_scope.py
        language: system
        pass_filenames: false
      - id: python-compile
        name: Python syntax check
        entry: python -m compileall -q main.py whatsapp_adapter.py whatsapp_commands.py whatsapp_config_policy.py whatsapp_helpers.py _whatsapp_helpers_impl.py whatsapp_chunking.py whatsapp_event.py tests
        language: system
        pass_filenames: false
      - id: whatsapp-markdown-tests
        name: WhatsApp Markdown regression tests
        entry: python -m unittest discover -v tests
        language: system
        pass_filenames: false
